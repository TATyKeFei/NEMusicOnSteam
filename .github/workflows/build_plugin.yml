name: build_plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install backend test runtime
      run: sudo apt-get update && sudo apt-get install -y lua5.4

    - name: Check types and run all test suites
      run: npm run check

    - name: Build plugin
      run: npm run build -- --no-install

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: artifact
        path: dist/*.star
        if-no-files-found: error
